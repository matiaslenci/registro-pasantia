<?xml version="1.0" encoding="UTF-8"?>
<!-- Escudo/edificio institucional placeholder. Simple y en un solo color para
     que se vea bien sobre el fondo azul del encabezado. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Escudo del Registro">
  <!-- Forma de escudo -->
  <path d="M50 4 L90 18 V50 C90 74 72 90 50 96 C28 90 10 74 10 50 V18 Z"
        fill="#ffffff" stroke="#c9a227" stroke-width="3"/>
  <!-- Edificio con columnas (representa el organismo público) -->
  <g fill="#0b3d68">
    <!-- Techo triangular -->
    <polygon points="50,22 74,38 26,38"/>
    <!-- Base -->
    <rect x="26" y="66" width="48" height="6"/>
    <!-- Columnas -->
    <rect x="31" y="42" width="6" height="22"/>
    <rect x="42" y="42" width="6" height="22"/>
    <rect x="52" y="42" width="6" height="22"/>
    <rect x="63" y="42" width="6" height="22"/>
  </g>
</svg>
